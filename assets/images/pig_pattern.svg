<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <!-- Pig Silhouette Symbol with ears, snout, curly tail, and trotters -->
    <g id="pig">
      <!-- Body -->
      <path d="M72 32 C50 32 32 44 26 62 C20 78 26 94 40 102 C54 110 82 110 94 100 C108 90 110 70 104 54 C96 38 84 32 72 32 Z" />
      <!-- Snout -->
      <ellipse cx="21" cy="74" rx="11" ry="8" />
      <circle cx="18" cy="74" r="2" fill="currentColor" />
      <circle cx="24" cy="74" r="2" fill="currentColor" />
      <!-- Ears -->
      <path d="M46 38 C38 20 52 16 58 32 Z" />
      <path d="M76 33 C82 16 94 20 88 36 Z" />
      <!-- Eye -->
      <circle cx="42" cy="54" r="2.8" fill="currentColor" />
      <!-- Curly Corkscrew Tail -->
      <path d="M102 74 C116 66 122 76 112 84 C104 90 120 96 124 86" fill="none" stroke-width="3" stroke-linecap="round" />
      <!-- Legs & Trotters -->
      <path d="M42 102 L38 122 M56 108 L56 122 M80 106 L80 122 M92 100 L96 122" fill="none" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Organic Leaf Accent -->
    <g id="leaf">
      <path d="M0 0 C12 -10 22 2 12 14 C2 10 0 2 0 0 Z" />
    </g>
  </defs>

  <!-- Pig Pattern Layer: Noticeable Farm Green & Gold Organic Tones -->
  <!-- Opacity 0.18 - 0.22 ensures it is clearly visible and noticeable without overpowering text -->
  <g fill="#166534" stroke="#166534" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.18">
    
    <!-- Pig 1: Top-Left (rotated -22 deg) -->
    <use href="#pig" x="15" y="20" transform="rotate(-22 55 60) scale(0.62)" fill-opacity="0.08" />

    <!-- Pig 2: Top-Right (rotated +36 deg) -->
    <use href="#pig" x="180" y="10" transform="rotate(36 220 55) scale(0.52)" fill-opacity="0.08" />

    <!-- Pig 3: Center-Left (rotated +16 deg) -->
    <use href="#pig" x="30" y="160" transform="rotate(16 80 195) scale(0.56)" fill-opacity="0.08" />

    <!-- Pig 4: Center-Right (rotated -40 deg) -->
    <use href="#pig" x="210" y="145" transform="rotate(-40 245 180) scale(0.58)" fill-opacity="0.08" />

    <!-- Pig 5: Bottom-Center (rotated +48 deg) -->
    <use href="#pig" x="120" y="230" transform="rotate(48 150 260) scale(0.48)" fill-opacity="0.08" />

    <!-- Pig 6: Top-Center Small Accent (rotated -65 deg) -->
    <use href="#pig" x="140" y="-10" transform="rotate(-65 155 15) scale(0.38)" fill-opacity="0.08" />

  </g>

  <!-- Warm Amber Leaves & Botanical Accents -->
  <g fill="#d97706" stroke="#b45309" stroke-width="1.8" opacity="0.20">
    <use href="#leaf" x="125" y="100" transform="rotate(25 125 100) scale(1.2)" fill-opacity="0.10" />
    <use href="#leaf" x="270" y="90" transform="rotate(-45 270 90) scale(1.0)" fill-opacity="0.10" />
    <use href="#leaf" x="70" y="270" transform="rotate(60 70 270) scale(1.1)" fill-opacity="0.10" />
    <use href="#leaf" x="280" y="260" transform="rotate(-15 280 260) scale(1.3)" fill-opacity="0.10" />
  </g>
</svg>